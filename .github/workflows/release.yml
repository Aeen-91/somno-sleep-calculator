name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist on the remote)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build arm64 APK and publish release
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "9.3.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key, Firebase stub and Gradle wrapper
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.somnosleep.shbxc"}},"api_key":[{"current_key":"placeholder"}]}],"configuration_version":"1"}' > app/google-services.json
          fi
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Psomno.abi=arm64-v8a --no-daemon --stacktrace

      - name: Verify arm64-only packaging
        id: verify
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          abis="$(python3 -c "import sys,zipfile;z=zipfile.ZipFile(sys.argv[1]);print(','.join(sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.count('/')>1})) or 'none')" "$apk")"
          echo "packaged ABIs: $abis"
          if [ "$abis" != "arm64-v8a" ]; then
            echo "::error::Expected only arm64-v8a, found: $abis"
            exit 1
          fi
          echo "abis=$abis" >> "$GITHUB_OUTPUT"

      - name: Collect artifact
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version="${version:-unversioned}"
          name="Somno-${version}-arm64.apk"
          cp "$apk" "dist/$name"
          ( cd dist && sha256sum "$name" > SHA256SUMS.txt )
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Somno-arm64-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          APK_NAME: ${{ steps.collect.outputs.name }}
          ABIS: ${{ steps.verify.outputs.abis }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            echo "## Somno $TAG"
            echo
            echo "Sleep cycle calculator, REM visualizer and local sleep analysis."
            echo
            echo "### Install"
            echo '```'
            echo "$APK_NAME"
            echo '```'
            echo "Download the APK, allow \`Install from unknown sources\`, then open it."
            echo
            echo "### Notes"
            echo "- Built for **arm64-v8a only** (verified: packaged ABIs = \`$ABIS\`). The app's native code comes from \`androidx.graphics-path\` and \`androidx.datastore\`; only the arm64 variants are bundled, so it will not run on 32-bit or x86 devices/emulators."
            echo "- minSdk 24 (Android 7.0), targetSdk 36."
            echo "- Signed with the standard Android debug key. Sideload only; it cannot be uploaded to the Play Store."
            echo "- Verify the download with \`SHA256SUMS.txt\`."
          } > "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/$APK_NAME" dist/SHA256SUMS.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "dist/$APK_NAME" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file "$notes"
          fi
