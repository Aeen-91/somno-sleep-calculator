name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ۱. ساخت فایل‌های ساختگی debug.keystore در ریشه و پوشه app تا هرجا گشت پیداش کنه
      - name: Create Dummy Keystore & Google Services
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p app
          cp debug.keystore app/debug.keystore
          
          # ساخت یک فایل خالی موقت در صورت نیاز به google-services
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          fi

      # ۲. ساخت رپر با گریدل سازگار ۸.۷
      - name: Generate Compatible Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      # ۳. بیلد خروجی APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
#Shoul
      # ۴. ذخیره و آپلود APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Somno-Sleep-Calculator-APK
          path: app/build/outputs/apk/debug/*.apk
